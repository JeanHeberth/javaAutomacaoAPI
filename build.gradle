plugins {
    id("java")
}

group = "com.br"
version = "1.0-SNAPSHOT"

repositories {
    mavenCentral()
}

def restAssuredVersion = "5.5.1"
def snakeYamlVersion = "2.3"
def jacksonVersion = "2.18.2"
def lombokVersion = "1.18.34"

dependencies {
    // Framework de automacao (clients, models, config) - usado por main e test
    implementation("io.rest-assured:rest-assured:$restAssuredVersion")
    implementation("org.yaml:snakeyaml:$snakeYamlVersion")
    implementation("com.fasterxml.jackson.core:jackson-databind:$jacksonVersion")

    compileOnly("org.projectlombok:lombok:$lombokVersion")
    annotationProcessor("org.projectlombok:lombok:$lombokVersion")
    testCompileOnly("org.projectlombok:lombok:$lombokVersion")
    testAnnotationProcessor("org.projectlombok:lombok:$lombokVersion")

    // Somente as classes de teste (@Test)
    testImplementation(platform("org.junit:junit-bom:6.0.0"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testImplementation("org.junit.jupiter:junit-jupiter-params")
    testImplementation("org.assertj:assertj-core:3.26.3")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

tasks.test {
    useJUnitPlatform()
    testLogging {
        events("passed", "skipped", "failed")
        exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL
    }
}
