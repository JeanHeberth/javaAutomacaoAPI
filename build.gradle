import java.net.Socket

plugins {
    id("java")
    id("io.qameta.allure") version "4.1.0"
}

group = "com.br"
version = "1.0-SNAPSHOT"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

repositories {
    mavenCentral()
}

def restAssuredVersion = "5.5.1"
def snakeYamlVersion = "2.3"
def jacksonVersion = "2.18.2"
def lombokVersion = "1.18.48"
def allureVersion = "2.35.5"
def aspectjVersion = "1.9.27"
def slf4jVersion = "2.0.18"
def logbackVersion = "1.6.4"
def testngVersion = "7.10.2"
def victoolsVersion = "4.37.0"

configurations {
    aspectjWeaver
    configureEach {
        exclude group: "io.qameta.allure", module: "allure-assertj"
    }
}

dependencies {
    // Framework de automacao (clients, models, config) - usado por main e test
    implementation("io.rest-assured:rest-assured:$restAssuredVersion")
    implementation("org.yaml:snakeyaml:$snakeYamlVersion")
    implementation("com.fasterxml.jackson.core:jackson-databind:$jacksonVersion")

    // Allure REST Assured, usado dentro de ApiClients.given() (camada main)
    // para anexar request/response de cada chamada HTTP ao relatorio.
    implementation(platform("io.qameta.allure:allure-bom:$allureVersion"))
    implementation("io.qameta.allure:allure-rest-assured")

    // Logger das classes de suporte (fluxo de negocio dos testes). Logback
    // e runtimeOnly pois o codigo so depende da API do SLF4J.
    implementation("org.slf4j:slf4j-api:$slf4jVersion")
    runtimeOnly("ch.qos.logback:logback-classic:$logbackVersion")

    compileOnly("org.projectlombok:lombok:$lombokVersion")
    annotationProcessor("org.projectlombok:lombok:$lombokVersion")
    testCompileOnly("org.projectlombok:lombok:$lombokVersion")
    testAnnotationProcessor("org.projectlombok:lombok:$lombokVersion")

    // Somente as classes de teste (@Test)
    testImplementation("org.testng:testng:$testngVersion")
    testImplementation("org.assertj:assertj-core:3.26.3")

    // Validacao de contrato (JSON Schema) e geracao de schemas a partir dos DTOs
    testImplementation("io.rest-assured:json-schema-validator:$restAssuredVersion")
    testImplementation("com.github.victools:jsonschema-generator:$victoolsVersion")

    // Allure: listener que gera os resultados de cada teste TestNG e
    // suporte a @Step/@Attachment via AspectJ.
    // allure-assertj fica de fora: o weaving do AssertJ via AspectJ quebra com
    // NoClassDefFoundError (Descriptable$AjcClosure) ao carregar as classes.
    testImplementation("io.qameta.allure:allure-testng")
    aspectjWeaver("org.aspectj:aspectjweaver:$aspectjVersion")
}

tasks.test {
    useTestNG()
    testLogging {
        events("passed", "skipped", "failed")
        exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL
        showStandardStreams = true
    }
    jvmArgs += ["-javaagent:${configurations.aspectjWeaver.singleFile}"]
}

// Necessario para o Jackson deserializar records pelo construtor canonico
// (usa os nomes dos parametros para casar com os campos do JSON).
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ["-parameters"]
}

// A task "allureServe" do plugin (Allure 3.9.0) gera a arvore de resultados
// vazia (bug conhecido nessa combinacao de versoes: os dados brutos estao
// corretos, mas o "tree.json" servido fica com roots/nodes vazios). Ate isso
// ser corrigido, esta task serve o HTML ja gerado por "allureReport" (esse
// sim, correto) num servidor HTTP simples.
tasks.register("allureOpen") {
    group = "verification"
    description = "Gera o relatorio Allure (allureReport) e o serve localmente, contornando o bug de arvore vazia do allureServe."
    dependsOn("allureReport")

    def reportDir = layout.buildDirectory.dir("reports/allure-report/allureReport")
    def port = (findProperty("allureOpenPort") ?: "8090").toString()

    doLast {
        def dir = reportDir.get().asFile
        def url = "http://127.0.0.1:${port}"

        def server = new ProcessBuilder("python3", "-m", "http.server", port, "--bind", "127.0.0.1")
                .directory(dir)
                .redirectErrorStream(true)
                .start()

        def aguardandoServidor = true
        for (int i = 0; i < 50 && aguardandoServidor; i++) {
            try {
                new Socket("127.0.0.1", port as int).close()
                aguardandoServidor = false
            } catch (IOException ignored) {
                Thread.sleep(100)
            }
        }

        println "Allure is running on ${url}"
        if (System.getProperty("os.name").toLowerCase().contains("mac")) {
            new ProcessBuilder("open", url).start()
        }

        Runtime.runtime.addShutdownHook(new Thread({ server.destroy() }))
        server.waitFor()
    }
}
